<!DOCTYPE html>
<html lang="ja">

<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>注文フォーム</title>

<script src="https://static.line-scdn.net/liff/edge/2/sdk.js"></script>

<style>
body {
  font-family: sans-serif;
  background: #f5f5f5;
  margin: 0;
  padding: 18px;
  font-size: 20px;
}

.box {
  max-width: 520px;
  margin: 20px auto;
  padding: 25px;
  background: white;
  border-radius: 14px;
  box-sizing: border-box;
}

h2 {
  text-align: center;
  font-size: 30px;
  margin-top: 5px;
}

.userBox {
  background: #f1f8f3;
  padding: 16px;
  border-radius: 10px;
  margin-bottom: 25px;
  line-height: 1.8;
}

label {
  display: block;
  margin-top: 24px;
  margin-bottom: 8px;
  font-weight: bold;
  font-size: 22px;
}

input,
select {
  width: 100%;
  box-sizing: border-box;
  min-height: 64px;
  padding: 16px;
  font-size: 23px;
  border: 1px solid #aaa;
  border-radius: 10px;
  background: white;
}

button {
  width: 100%;
  min-height: 64px;
  padding: 16px;
  margin-top: 28px;
  font-size: 22px;
  font-weight: bold;
  background: #06C755;
  color: white;
  border: none;
  border-radius: 10px;
}

button:disabled {
  background: #aaa;
}

#message {
  margin-top: 20px;
  text-align: center;
  line-height: 1.6;
  white-space: pre-wrap;
}

#confirm {
  display: none;
  border: 1px solid #999;
  border-radius: 10px;
  padding: 20px;
  margin-top: 25px;
  line-height: 1.8;
  background: #fafafa;
}

.success {
  font-weight: bold;
  font-size: 22px;
}
</style>
</head>

<body>

<div class="box">

<h2>注文フォーム</h2>

<div class="userBox">
  <div>
    利用者ID：
    <strong id="userIdText">確認中...</strong>
  </div>

  <div>
    お名前：
    <strong id="userNameText">確認中...</strong>
  </div>
</div>

<label for="product">商品</label>

<select id="product">
  <option value="">商品を選択してください</option>
</select>

<label for="qty">数量</label>

<input
  id="qty"
  type="number"
  value="1"
  min="1"
>

<label for="date">配達希望日</label>

<input
  id="date"
  type="date"
>

<button
  id="confirmButton"
  type="button"
  onclick="confirmOrder()"
  disabled
>
注文確認
</button>

<div id="message">
LINE情報を確認しています...
</div>

<div id="confirm">

<h3>注文内容確認</h3>

<div id="confirmText"></div>

<button
  id="sendButton"
  type="button"
  onclick="sendOrder()"
>
注文確定
</button>

</div>

</div>

<form
  id="apiForm"
  method="post"
  target="resultFrame"
  style="display:none;"
>

<input
  type="hidden"
  name="action"
  id="action"
>

<input
  type="hidden"
  name="lineUserId"
  id="sendLineUserId"
>

<input
  type="hidden"
  name="product"
  id="sendProduct"
>

<input
  type="hidden"
  name="qty"
  id="sendQty"
>

<input
  type="hidden"
  name="date"
  id="sendDate"
>

</form>

<iframe
  name="resultFrame"
  id="resultFrame"
  style="display:none;"
></iframe>

<script>

const LIFF_ID =
  "2011016159-YnmXbx1i";

const ORDER_PAGE_URL =
  "https://hyoshioka110-cmd.github.io/User-Register/order.html";

const ORDER_GAS_URL =
  "https://script.google.com/macros/s/AKfycbwg6eVWj-IGAif9hTAOVjn1joTCQveAALD3qfotkySfRKiOc5o5ecn0aaJr5iWNw_rfsg/exec";

let lineUserId = "";
let currentUser = null;


async function initialize() {

  const message =
    document.getElementById("message");

  try {

    message.textContent =
      "LINE情報を確認しています...";

    await liff.init({
      liffId: LIFF_ID
    });

    if (!liff.isLoggedIn()) {

      message.textContent =
        "LINEにログインします...";

      liff.login({
        redirectUri: ORDER_PAGE_URL
      });

      return;
    }

    const profile =
      await liff.getProfile();

    lineUserId =
      profile.userId;

    message.textContent =
      "利用者情報と商品一覧を取得しています...";

    loadOrderData();

  } catch (error) {

    console.error(error);

    message.textContent =
      "LINE情報を取得できませんでした。\nLINEからもう一度開いてください。";

  }

}


function loadOrderData() {

  document
    .getElementById("action")
    .value =
    "initOrder";

  document
    .getElementById("sendLineUserId")
    .value =
    lineUserId;

  submitApi();

}


function submitApi() {

  const form =
    document.getElementById("apiForm");

  form.action =
    ORDER_GAS_URL;

  form.submit();

}


window.addEventListener(
  "message",
  function(event) {

    if (
      !event.data ||
      event.data.type !==
        "orderSystemResult"
    ) {
      return;
    }

    const result =
      event.data.data;

    const message =
      document.getElementById("message");

    if (!result.ok) {

      message.textContent =
        result.message;

      document
        .getElementById("confirmButton")
        .disabled =
        true;

      return;
    }

    if (
      result.action ===
      "initOrder"
    ) {

      currentUser = {
        userId:
          result.userId,
        name:
          result.name
      };

      document
        .getElementById("userIdText")
        .textContent =
        result.userId;

      document
        .getElementById("userNameText")
        .textContent =
        result.name;

      const select =
        document
          .getElementById("product");

      select.innerHTML =
        '<option value="">商品を選択してください</option>';

      result.products
        .forEach(function(item) {

          const option =
            document.createElement(
              "option"
            );

          option.value =
            item.name;

          option.textContent =
            item.name +
            "　￥" +
            Number(
              item.price
            ).toLocaleString();

          select.appendChild(
            option
          );

        });

      document
        .getElementById("confirmButton")
        .disabled =
        false;

      message.textContent =
        "商品・数量・配達希望日を入力してください。";

    }

    if (
      result.action ===
      "saveOrder"
    ) {

      message.textContent =
        result.message;

      message.className =
        "success";

      document
        .getElementById("confirm")
        .style.display =
        "none";

      document
        .getElementById("product")
        .disabled =
        true;

      document
        .getElementById("qty")
        .disabled =
        true;

      document
        .getElementById("date")
        .disabled =
        true;

      document
        .getElementById("confirmButton")
        .disabled =
        true;

      document
        .getElementById("sendButton")
        .disabled =
        true;

    }

  }
);


function confirmOrder() {

  if (!currentUser) {
    alert("利用者情報を確認できていません。");
    return;
  }

  const product =
    document
      .getElementById("product")
      .value;

  const qty =
    document
      .getElementById("qty")
      .value;

  const date =
    document
      .getElementById("date")
      .value;

  if (product === "") {

    alert(
      "商品を選択してください。"
    );

    return;
  }

  if (
    qty === "" ||
    Number(qty) < 1
  ) {

    alert(
      "数量を正しく入力してください。"
    );

    return;
  }

  if (date === "") {

    alert(
      "配達希望日を入力してください。"
    );

    return;
  }

  document
    .getElementById("confirmText")
    .innerHTML =

      "利用者ID：" +
      currentUser.userId +

      "<br>お名前：" +
      currentUser.name +

      "<br>商品：" +
      product +

      "<br>数量：" +
      qty +

      "<br>配達日：" +
      date;

  document
    .getElementById("confirm")
    .style.display =
    "block";

  document
    .getElementById("confirm")
    .scrollIntoView({
      behavior: "smooth"
    });

}


function sendOrder() {

  const sendButton =
    document
      .getElementById("sendButton");

  sendButton.disabled =
    true;

  document
    .getElementById("message")
    .textContent =
    "注文を送信しています...";

  document
    .getElementById("action")
    .value =
    "saveOrder";

  document
    .getElementById("sendLineUserId")
    .value =
    lineUserId;

  document
    .getElementById("sendProduct")
    .value =
    document
      .getElementById("product")
      .value;

  document
    .getElementById("sendQty")
    .value =
    document
      .getElementById("qty")
      .value;

  document
    .getElementById("sendDate")
    .value =
    document
      .getElementById("date")
      .value;

  submitApi();

}


initialize();

</script>

</body>
</html>

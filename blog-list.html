<!DOCTYPE html>
<html lang="ja">

<head>
<meta charset="UTF-8">

<meta
  name="viewport"
  content="width=device-width, initial-scale=1"
>

<title>みんなのブログ</title>

<script src="https://static.line-scdn.net/liff/edge/2/sdk.js"></script>

<style>

body {
  font-family: sans-serif;
  background: #f5f5f5;
  margin: 0;
  padding: 14px;
  font-size: 17px;
}

.container {
  max-width: 700px;
  margin: 0 auto;
}

h1 {
  text-align: center;
  font-size: 28px;
}

.userBox {
  background: #eef8f0;
  padding: 14px;
  border-radius: 10px;
  margin-bottom: 20px;
  line-height: 1.7;
}

.post {
  background: white;
  border-radius: 14px;
  padding: 18px;
  margin-bottom: 22px;
}

.postHeader {
  margin-bottom: 14px;
}

.postName {
  font-weight: bold;
  font-size: 20px;
}

.postDate {
  font-size: 14px;
  color: #777;
  margin-top: 4px;
}

.mood {
  margin-top: 6px;
}

.postTitle {
  font-size: 23px;
  font-weight: bold;
  margin: 18px 0;
}

.postImage {
  width: 100%;
  max-height: 450px;
  object-fit: contain;
  border-radius: 10px;
  margin-bottom: 18px;
  background: #eee;
}

.section {
  margin-top: 18px;
  padding: 15px;
  border-radius: 10px;
}

.original {
  background: #fff8e8;
}

.corrected {
  background: #edf8ef;
}

.grammar {
  background: #eef4ff;
}

.advice {
  background: #f7efff;
}

.sectionTitle {
  font-weight: bold;
  font-size: 18px;
  margin-bottom: 8px;
}

.sectionText {
  white-space: pre-wrap;
  line-height: 1.7;
}

.actions {
  display: flex;
  gap: 10px;
  margin-top: 18px;
}

.actionButton {
  flex: 1;
  min-height: 48px;
  font-size: 17px;
  border: none;
  border-radius: 9px;
  background: #eeeeee;
}

.liked {
  background: #ffdfe5;
}

.commentArea {
  display: none;
  margin-top: 18px;
  border-top: 1px solid #ddd;
  padding-top: 16px;
}

.commentItem {
  padding: 10px 0;
  border-bottom: 1px solid #eee;
}

.commentName {
  font-weight: bold;
}

.commentDate {
  font-size: 13px;
  color: #777;
}

.commentText {
  margin-top: 5px;
  white-space: pre-wrap;
}

.commentInput {
  width: 100%;
  min-height: 90px;
  box-sizing: border-box;
  padding: 12px;
  margin-top: 14px;
  font-size: 17px;
  border: 1px solid #aaa;
  border-radius: 9px;
}

.commentSend {
  width: 100%;
  min-height: 50px;
  margin-top: 10px;
  font-size: 18px;
  background: #06C755;
  color: white;
  border: none;
  border-radius: 9px;
}

#message {
  text-align: center;
  padding: 20px;
  line-height: 1.6;
}

</style>

</head>


<body>

<div class="container">

<h1>みんなのブログ</h1>

<div class="userBox">

  利用者：
  <strong id="viewerName">
    確認中...
  </strong>

</div>

<div id="message">
LINE情報を確認しています...
</div>

<div id="postList"></div>

</div>


<form
  id="apiForm"
  method="post"
  target="resultFrame"
  style="display:none;"
>

<input
  type="hidden"
  name="action"
  id="action"
>

<input
  type="hidden"
  name="lineUserId"
  id="sendLineUserId"
>

<input
  type="hidden"
  name="postId"
  id="sendPostId"
>

<input
  type="hidden"
  name="comment"
  id="sendComment"
>

</form>


<iframe
  name="resultFrame"
  id="resultFrame"
  style="display:none;"
></iframe>


<script>

const LIFF_ID =
  "2011016159-YnmXbx1i";

const BLOG_LIST_URL =
  "https://hyoshioka110-cmd.github.io/User-Register/blog-list.html";

const BLOG_GAS_URL =
  "https://script.google.com/macros/s/AKfycbyXhyaC-7Qd3vDRR9u9ovbbGA0cA4X002JdMe1OxVvWw7-XE4OL7dyB9DZaV42kHcJyqw/exec";


let lineUserId = "";

let currentCommentPostId = "";


/* ==========================
   LINE初期化
========================== */

async function initialize() {

  const message =
    document.getElementById("message");

  try {

    await liff.init({
      liffId: LIFF_ID
    });


    if (!liff.isLoggedIn()) {

      liff.login({
        redirectUri:
          BLOG_LIST_URL
      });

      return;
    }


    const profile =
      await liff.getProfile();


    lineUserId =
      profile.userId;


    document
      .getElementById("viewerName")
      .textContent =
      profile.displayName;


    message.textContent =
      "ブログを読み込んでいます...";


    callApi(
      "getPosts"
    );


  } catch (error) {

    console.error(error);

    message.textContent =
      "LINE情報を取得できませんでした。";

  }

}


/* ==========================
   API呼び出し
========================== */

function callApi(
  action,
  postId = "",
  comment = ""
) {

  document
    .getElementById("action")
    .value =
    action;


  document
    .getElementById("sendLineUserId")
    .value =
    lineUserId;


  document
    .getElementById("sendPostId")
    .value =
    postId;


  document
    .getElementById("sendComment")
    .value =
    comment;


  const form =
    document.getElementById("apiForm");


  form.action =
    BLOG_GAS_URL;


  form.submit();

}


/* ==========================
   APIから結果受信
========================== */

window.addEventListener(
  "message",
  function(event) {

    if (
      !event.data ||
      event.data.type !==
        "blogSystemResult"
    ) {
      return;
    }


    const result =
      event.data.data;


    if (!result.ok) {

      document
        .getElementById("message")
        .textContent =
        result.message;

      return;
    }


    if (
      result.action ===
      "getPosts"
    ) {

      renderPosts(
        result.posts
      );

      return;

    }


    if (
      result.action ===
      "toggleLike"
    ) {

      updateLike(
        result
      );

      return;

    }


    if (
      result.action ===
      "getComments"
    ) {

      renderComments(
        result.postId,
        result.comments
      );

      return;

    }


    if (
      result.action ===
      "addComment"
    ) {

      const input =
        document.getElementById(
          "commentInput_" +
          result.postId
        );


      if (input) {
        input.value = "";
      }


      const count =
        document.getElementById(
          "commentCount_" +
          result.postId
        );


      if (count) {

        count.textContent =
          result.commentCount;

      }


      callApi(
        "getComments",
        result.postId
      );

    }

  }
);


/* ==========================
   投稿一覧表示
========================== */

function renderPosts(posts) {

  const message =
    document.getElementById("message");

  const list =
    document.getElementById("postList");


  message.textContent =
    "";


  list.innerHTML =
    "";


  if (
    !posts ||
    posts.length === 0
  ) {

    message.textContent =
      "まだ公開された投稿はありません。";

    return;

  }


  posts.forEach(
    function(post) {

      const box =
        document.createElement(
          "div"
        );


      box.className =
        "post";


      /* 投稿者 */

      const header =
        document.createElement(
          "div"
        );

      header.className =
        "postHeader";


      const name =
        document.createElement(
          "div"
        );

      name.className =
        "postName";

      name.textContent =
        post.name;


      const date =
        document.createElement(
          "div"
        );

      date.className =
        "postDate";

      date.textContent =
        post.date;


      const mood =
        document.createElement(
          "div"
        );

      mood.className =
        "mood";

      mood.textContent =
        moodText(
          post.mood
        );


      header.appendChild(
        name
      );

      header.appendChild(
        date
      );

      header.appendChild(
        mood
      );


      box.appendChild(
        header
      );


      /* タイトル */

      const title =
        document.createElement(
          "div"
        );

      title.className =
        "postTitle";

      title.textContent =
        post.title;


      box.appendChild(
        title
      );


      /* 写真 */

      if (post.photoUrl) {

        const img =
          document.createElement(
            "img"
          );

        img.className =
          "postImage";

        img.src =
          post.photoUrl;

        img.alt =
          "投稿写真";


        box.appendChild(
          img
        );

      }


      /* 本人文章 */

      box.appendChild(
        createSection(
          "✏️ 本人が書いた日本語",
          post.article,
          "original"
        )
      );


      /* AI添削 */

      box.appendChild(
        createSection(
          "✅ AI添削後の日本語",
          post.corrected,
          "corrected"
        )
      );


      /* 文法 */

      box.appendChild(
        createSection(
          "📚 文法ポイント",
          post.grammar,
          "grammar"
        )
      );


      /* アドバイス */

      if (post.advice) {

        box.appendChild(
          createSection(
            "💡 今日の一言アドバイス",
            post.advice,
            "advice"
          )
        );

      }


      /* いいね・コメント */

      const actions =
        document.createElement(
          "div"
        );

      actions.className =
        "actions";


      const likeButton =
        document.createElement(
          "button"
        );

      likeButton.id =
        "like_" +
        post.postId;

      likeButton.className =
        "actionButton" +
        (
          post.likedByMe
            ? " liked"
            : ""
        );


      likeButton.textContent =
        "👍 いいね " +
        post.likeCount;


      likeButton.onclick =
        function() {

          callApi(
            "toggleLike",
            post.postId
          );

        };


      const commentButton =
        document.createElement(
          "button"
        );

      commentButton.className =
        "actionButton";


      const countSpan =
        document.createElement(
          "span"
        );

      countSpan.id =
        "commentCount_" +
        post.postId;

      countSpan.textContent =
        post.commentCount;


      commentButton.append(
        "💬 コメント ",
        countSpan
      );


      commentButton.onclick =
        function() {

          toggleComments(
            post.postId
          );

        };


      actions.appendChild(
        likeButton
      );

      actions.appendChild(
        commentButton
      );


      box.appendChild(
        actions
      );


      /* コメント欄 */

      const commentArea =
        document.createElement(
          "div"
        );

      commentArea.id =
        "commentArea_" +
        post.postId;

      commentArea.className =
        "commentArea";


      const commentList =
        document.createElement(
          "div"
        );

      commentList.id =
        "commentList_" +
        post.postId;


      const input =
        document.createElement(
          "textarea"
        );

      input.id =
        "commentInput_" +
        post.postId;

      input.className =
        "commentInput";

      input.placeholder =
        "コメントを書いてください";


      const sendButton =
        document.createElement(
          "button"
        );

      sendButton.className =
        "commentSend";

      sendButton.textContent =
        "コメントを送信";


      sendButton.onclick =
        function() {

          sendComment(
            post.postId
          );

        };


      commentArea.appendChild(
        commentList
      );

      commentArea.appendChild(
        input
      );

      commentArea.appendChild(
        sendButton
      );


      box.appendChild(
        commentArea
      );


      list.appendChild(
        box
      );

    }
  );

}


/* ==========================
   本文セクション作成
========================== */

function createSection(
  title,
  text,
  className
) {

  const section =
    document.createElement(
      "div"
    );


  section.className =
    "section " +
    className;


  const heading =
    document.createElement(
      "div"
    );

  heading.className =
    "sectionTitle";

  heading.textContent =
    title;


  const body =
    document.createElement(
      "div"
    );

  body.className =
    "sectionText";

  body.textContent =
    text || "";


  section.appendChild(
    heading
  );

  section.appendChild(
    body
  );


  return section;

}


/* ==========================
   いいね
========================== */

function updateLike(result) {

  const button =
    document.getElementById(
      "like_" +
      result.postId
    );


  if (!button) {
    return;
  }


  button.textContent =
    "👍 いいね " +
    result.likeCount;


  if (result.liked) {

    button.classList.add(
      "liked"
    );

  } else {

    button.classList.remove(
      "liked"
    );

  }

}


/* ==========================
   コメント表示
========================== */

function toggleComments(
  postId
) {

  const area =
    document.getElementById(
      "commentArea_" +
      postId
    );


  if (
    area.style.display ===
    "block"
  ) {

    area.style.display =
      "none";

    return;

  }


  area.style.display =
    "block";


  currentCommentPostId =
    postId;


  callApi(
    "getComments",
    postId
  );

}


/* ==========================
   コメント描画
========================== */

function renderComments(
  postId,
  comments
) {

  const list =
    document.getElementById(
      "commentList_" +
      postId
    );


  if (!list) {
    return;
  }


  list.innerHTML =
    "";


  if (
    !comments ||
    comments.length === 0
  ) {

    const empty =
      document.createElement(
        "div"
      );

    empty.textContent =
      "まだコメントはありません。";


    list.appendChild(
      empty
    );

    return;

  }


  comments.forEach(
    function(comment) {

      const item =
        document.createElement(
          "div"
        );

      item.className =
        "commentItem";


      const name =
        document.createElement(
          "div"
        );

      name.className =
        "commentName";

      name.textContent =
        comment.name;


      const date =
        document.createElement(
          "div"
        );

      date.className =
        "commentDate";

      date.textContent =
        comment.date;


      const text =
        document.createElement(
          "div"
        );

      text.className =
        "commentText";

      text.textContent =
        comment.comment;


      item.appendChild(
        name
      );

      item.appendChild(
        date
      );

      item.appendChild(
        text
      );


      list.appendChild(
        item
      );

    }
  );

}


/* ==========================
   コメント送信
========================== */

function sendComment(
  postId
) {

  const input =
    document.getElementById(
      "commentInput_" +
      postId
    );


  const comment =
    input.value.trim();


  if (
    comment === ""
  ) {

    alert(
      "コメントを入力してください。"
    );

    return;

  }


  callApi(
    "addComment",
    postId,
    comment
  );

}


/* ==========================
   気分表示
========================== */

function moodText(mood) {

  switch (mood) {

    case "とても楽しい":
      return "😄 とても楽しい";

    case "楽しい":
      return "🙂 楽しい";

    case "普通":
      return "😐 普通";

    case "少し大変":
      return "😟 少し大変";

    case "困っている":
      return "😢 困っている";

    default:
      return mood || "";

  }

}


initialize();

</script>

</body>

</html>

<!DOCTYPE html>
<html lang="ja">

<head>

<meta charset="UTF-8">

<meta
  name="viewport"
  content="width=device-width, initial-scale=1"
>

<title>日本語ブログ</title>

<script src="https://static.line-scdn.net/liff/edge/2/sdk.js"></script>

<style>

body {
  font-family: sans-serif;
  background: #f5f5f5;
  margin: 0;
  padding: 18px;
  color: #333;
}

.container {
  max-width: 520px;
  margin: 20px auto;
}

.header {
  background: white;
  border-radius: 14px;
  padding: 24px 20px;
  text-align: center;
  margin-bottom: 15px;
}

h1 {
  margin: 0 0 10px;
  font-size: 27px;
}

.description {
  margin: 0;
  line-height: 1.7;
  font-size: 16px;
  color: #555;
}


/* =========================
   利用者情報
========================= */

.userBox {
  background: #eef8f0;
  border-radius: 12px;
  padding: 16px;
  margin-bottom: 18px;
  line-height: 1.8;
  font-size: 16px;
}

.userRow {
  display: flex;
  gap: 10px;
}

.userLabel {
  min-width: 80px;
  color: #555;
}

.userValue {
  font-weight: bold;
}


/* =========================
   メニューボタン
========================= */

.menuButton {
  display: block;
  box-sizing: border-box;
  width: 100%;
  background: white;
  border-radius: 14px;
  padding: 22px 18px;
  margin-bottom: 14px;
  text-decoration: none;
  color: #222;
  border: 1px solid #e5e5e5;
}

.menuTitle {
  display: flex;
  align-items: center;
  gap: 12px;
  font-size: 21px;
  font-weight: bold;
  margin-bottom: 7px;
}

.icon {
  font-size: 29px;
  width: 38px;
  text-align: center;
}

.menuText {
  padding-left: 50px;
  font-size: 15px;
  line-height: 1.6;
  color: #666;
}


/* =========================
   読み込みメッセージ
========================= */

#message {
  text-align: center;
  padding: 14px;
  line-height: 1.6;
  color: #555;
}

.note {
  text-align: center;
  font-size: 14px;
  line-height: 1.6;
  color: #777;
  margin-top: 20px;
}

.hidden {
  display: none;
}

</style>

</head>


<body>

<div class="container">


  <!-- =========================
       タイトル
  ========================== -->

  <div class="header">

    <h1>
      日本語ブログ
    </h1>

    <p class="description">
      日本語でブログを書いたり、
      <br>
      みんなのブログを読んだりできます。
    </p>

  </div>


  <!-- =========================
       利用者情報
  ========================== -->

  <div
    id="userBox"
    class="userBox hidden"
  >

    <div class="userRow">

      <div class="userLabel">
        利用者ID：
      </div>

      <div
        id="userId"
        class="userValue"
      >
      </div>

    </div>


    <div class="userRow">

      <div class="userLabel">
        氏名：
      </div>

      <div
        id="userName"
        class="userValue"
      >
      </div>

    </div>

  </div>


  <!-- =========================
       読み込み中
  ========================== -->

  <div id="message">
    LINE情報を確認しています...
  </div>


  <!-- =========================
       ブログメニュー
  ========================== -->

  <div
    id="blogMenu"
    class="hidden"
  >


    <!-- ブログを書く -->

    <a
      class="menuButton"
      href="./blog.html"
    >

      <div class="menuTitle">

        <span class="icon">
          ✏️
        </span>

        <span>
          ブログを書く
        </span>

      </div>

      <div class="menuText">
        日本語でブログを書いて、
        AIの添削を受けて投稿します。
      </div>

    </a>


    <!-- みんなのブログ -->

    <a
      class="menuButton"
      href="./blog-list.html"
    >

      <div class="menuTitle">

        <span class="icon">
          📖
        </span>

        <span>
          みんなのブログを読む
        </span>

      </div>

      <div class="menuText">
        公開されたブログを読んで、
        いいねやコメントができます。
      </div>

    </a>


    <!-- 人気ランキング -->

    <a
      class="menuButton"
      href="./blog-ranking.html"
    >

      <div class="menuTitle">

        <span class="icon">
          🏆
        </span>

        <span>
          人気ランキング
        </span>

      </div>

      <div class="menuText">
        人気のブログや、
        みんなの活動をランキングで見ます。
      </div>

    </a>


    <div class="note">
      日本語をたくさん使って、
      楽しく勉強しましょう。
    </div>

  </div>

</div>


<!-- =========================
     GAS送信用フォーム
========================= -->

<form
  id="apiForm"
  method="post"
  target="resultFrame"
  style="display:none;"
>

  <input
    type="hidden"
    name="action"
    id="action"
    value="initBlog"
  >

  <input
    type="hidden"
    name="lineUserId"
    id="sendLineUserId"
  >

</form>


<!-- =========================
     GAS応答受信用
========================= -->

<iframe
  name="resultFrame"
  id="resultFrame"
  style="display:none;"
></iframe>


<script>


// ========================================
// 設定
// ========================================

const LIFF_ID =
  "2011016159-YnmXbx1i";


const BLOG_MENU_URL =
  "https://hyoshioka110-cmd.github.io/User-Register/blog-menu.html";


const BLOG_GAS_URL =
  "https://script.google.com/macros/s/AKfycbyXhyaC-7Qd3vDRR9u9ovbbGA0cA4X002JdMe1OxVvWw7-XE4OL7dyB9DZaV42kHcJyqw/exec";


let lineUserId = "";


// ========================================
// LINE初期化
// ========================================

async function initialize() {

  const message =
    document.getElementById(
      "message"
    );

  try {

    message.textContent =
      "LINE情報を確認しています...";


    await liff.init({
      liffId: LIFF_ID
    });


    // LINEログインしていない場合

    if (!liff.isLoggedIn()) {

      message.textContent =
        "LINEにログインします...";


      liff.login({
        redirectUri:
          BLOG_MENU_URL
      });


      return;

    }


    // LINEプロフィール取得

    const profile =
      await liff.getProfile();


    lineUserId =
      profile.userId;


    if (!lineUserId) {

      throw new Error(
        "LINEユーザーIDを取得できませんでした。"
      );

    }


    message.textContent =
      "利用者情報を確認しています...";


    // GASへ利用者確認を依頼

    callInitBlog();


  } catch (error) {

    console.error(
      error
    );


    message.textContent =
      "LINE情報を取得できませんでした。\nLINEからもう一度開いてください。";

  }

}


// ========================================
// GASへ利用者情報を問い合わせ
// ========================================

function callInitBlog() {

  document
    .getElementById(
      "action"
    )
    .value =
    "initBlog";


  document
    .getElementById(
      "sendLineUserId"
    )
    .value =
    lineUserId;


  const form =
    document.getElementById(
      "apiForm"
    );


  form.action =
    BLOG_GAS_URL;


  form.submit();

}


// ========================================
// GASからの結果を受信
// ========================================

window.addEventListener(
  "message",
  function(event) {


    if (
      !event.data ||
      event.data.type !==
        "blogSystemResult"
    ) {

      return;

    }


    const result =
      event.data.data;


    const message =
      document.getElementById(
        "message"
      );


    // エラー

    if (!result.ok) {

      message.textContent =
        result.message ||
        "利用者情報を取得できませんでした。";


      return;

    }


    // initBlog以外は無視

    if (
      result.action !==
      "initBlog"
    ) {

      return;

    }


    // ====================================
    // 利用者ID表示
    // ====================================

    document
      .getElementById(
        "userId"
      )
      .textContent =
      result.userId;


    // ====================================
    // 氏名表示
    // ====================================

    document
      .getElementById(
        "userName"
      )
      .textContent =
      result.name;


    // ====================================
    // 利用者情報を表示
    // ====================================

    document
      .getElementById(
        "userBox"
      )
      .classList
      .remove(
        "hidden"
      );


    // ====================================
    // ブログメニューを表示
    // ====================================

    document
      .getElementById(
        "blogMenu"
      )
      .classList
      .remove(
        "hidden"
      );


    // 読み込み表示を消す

    message.textContent =
      "";

  }
);


// ========================================
// 開始
// ========================================

initialize();


</script>

</body>

</html>

<!DOCTYPE html>
<html lang="ja">

<head>

<meta charset="UTF-8">

<meta
  name="viewport"
  content="width=device-width, initial-scale=1"
>

<title>日本語ブログ</title>

<style>

body {
  font-family: sans-serif;
  background: #f5f5f5;
  margin: 0;
  padding: 18px;
  color: #333;
}

.container {
  max-width: 520px;
  margin: 20px auto;
}

.header {
  background: white;
  border-radius: 14px;
  padding: 24px 20px;
  text-align: center;
  margin-bottom: 18px;
}

h1 {
  margin: 0 0 10px;
  font-size: 27px;
}

.description {
  margin: 0;
  line-height: 1.7;
  font-size: 16px;
  color: #555;
}

.menuButton {
  display: block;
  box-sizing: border-box;
  width: 100%;
  background: white;
  border-radius: 14px;
  padding: 22px 18px;
  margin-bottom: 14px;
  text-decoration: none;
  color: #222;
  border: 1px solid #e5e5e5;
}

.menuTitle {
  display: flex;
  align-items: center;
  gap: 12px;
  font-size: 21px;
  font-weight: bold;
  margin-bottom: 7px;
}

.icon {
  font-size: 29px;
  width: 38px;
  text-align: center;
}

.menuText {
  padding-left: 50px;
  font-size: 15px;
  line-height: 1.6;
  color: #666;
}

.note {
  text-align: center;
  font-size: 14px;
  line-height: 1.6;
  color: #777;
  margin-top: 20px;
}

</style>

</head>


<body>

<div class="container">

  <div class="header">

    <h1>
      日本語ブログ
    </h1>

    <p class="description">
      日本語でブログを書いたり、
      <br>
      みんなのブログを読んだりできます。
    </p>

  </div>


  <!-- ============================= -->
  <!-- ブログを書く -->
  <!-- ============================= -->

  <a
    class="menuButton"
    href="./blog.html"
  >

    <div class="menuTitle">

      <span class="icon">
        ✏️
      </span>

      <span>
        ブログを書く
      </span>

    </div>

    <div class="menuText">
      日本語でブログを書いて、
      AIの添削を受けて投稿します。
    </div>

  </a>


  <!-- ============================= -->
  <!-- みんなのブログ -->
  <!-- ============================= -->

  <a
    class="menuButton"
    href="./blog-list.html"
  >

    <div class="menuTitle">

      <span class="icon">
        📖
      </span>

      <span>
        みんなのブログを読む
      </span>

    </div>

    <div class="menuText">
      公開されたブログを読んで、
      いいねやコメントができます。
    </div>

  </a>


  <!-- ============================= -->
  <!-- 人気ランキング -->
  <!-- ============================= -->

  <a
    class="menuButton"
    href="./blog-ranking.html"
  >

    <div class="menuTitle">

      <span class="icon">
        🏆
      </span>

      <span>
        人気ランキング
      </span>

    </div>

    <div class="menuText">
      人気のブログや、
      みんなの活動をランキングで見ます。
    </div>

  </a>


  <div class="note">
    日本語をたくさん使って、
    楽しく勉強しましょう。
  </div>

</div>

</body>

</html>

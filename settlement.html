<!DOCTYPE html>
<html lang="ja">

<head>
<meta charset="UTF-8">

<meta
  name="viewport"
  content="width=device-width, initial-scale=1"
>

<title>ご精算</title>

<script src="https://static.line-scdn.net/liff/edge/2/sdk.js"></script>

<style>

body {
  font-family: sans-serif;
  background: #f5f5f5;
  margin: 0;
  padding: 18px;
  font-size: 20px;
}

.box {
  max-width: 560px;
  margin: 20px auto;
  background: white;
  padding: 24px;
  border-radius: 14px;
  box-sizing: border-box;
}

h2 {
  text-align: center;
  font-size: 30px;
}

.userBox {
  background: #f1f8f3;
  padding: 16px;
  border-radius: 10px;
  margin-bottom: 24px;
  line-height: 1.8;
}

.totalBox {
  border: 2px solid #06C755;
  border-radius: 12px;
  padding: 22px;
  text-align: center;
  margin-top: 20px;
}

.totalLabel {
  font-size: 20px;
}

.total {
  font-size: 36px;
  font-weight: bold;
  margin-top: 8px;
}

.bankBox {
  margin-top: 28px;
  padding: 20px;
  background: #fafafa;
  border-radius: 10px;
  line-height: 1.8;
  white-space: pre-line;
}

#message {
  text-align: center;
  margin-top: 20px;
  line-height: 1.6;
  white-space: pre-wrap;
}

</style>

</head>

<body>

<div class="box">

<h2>ご精算</h2>

<div class="userBox">

  <div>
    利用者ID：
    <strong id="userIdText">確認中...</strong>
  </div>

  <div>
    お名前：
    <strong id="userNameText">確認中...</strong>
  </div>

</div>

<div id="message">
LINE情報を確認しています...
</div>

<div
  id="settlementArea"
  style="display:none;"
>

  <div class="totalBox">

    <div class="totalLabel">
      未払い金額
    </div>

    <div
      class="total"
      id="totalText"
    >
      ￥0
    </div>

  </div>


  <div class="bankBox">

    <strong>振込先</strong>

    <div id="bankText"></div>

  </div>

</div>

</div>


<form
  id="apiForm"
  method="post"
  target="resultFrame"
  style="display:none;"
>

<input
  type="hidden"
  name="action"
  value="getSettlement"
>

<input
  type="hidden"
  name="lineUserId"
  id="sendLineUserId"
>

</form>


<iframe
  name="resultFrame"
  id="resultFrame"
  style="display:none;"
></iframe>


<script>

const LIFF_ID =
  "2011016159-YnmXbx1i";

const SETTLEMENT_PAGE_URL =
  "https://hyoshioka110-cmd.github.io/User-Register/settlement.html";

const ORDER_GAS_URL =
  "https://script.google.com/macros/s/AKfycbwg6eVWj-IGAif9hTAOVjn1joTCQveAALD3qfotkySfRKiOc5o5ecn0aaJr5iWNw_rfsg/exec";

let lineUserId = "";


async function initialize() {

  const message =
    document.getElementById("message");

  try {

    message.textContent =
      "LINE情報を確認しています...";

    await liff.init({
      liffId: LIFF_ID
    });

    if (!liff.isLoggedIn()) {

      message.textContent =
        "LINEにログインします...";

      liff.login({
        redirectUri:
          SETTLEMENT_PAGE_URL
      });

      return;
    }

    const profile =
      await liff.getProfile();

    lineUserId =
      profile.userId;

    message.textContent =
      "精算情報を取得しています...";

    document
      .getElementById("sendLineUserId")
      .value =
      lineUserId;

    const form =
      document
        .getElementById("apiForm");

    form.action =
      ORDER_GAS_URL;

    form.submit();

  } catch (error) {

    console.error(error);

    message.textContent =
      "LINE情報を取得できませんでした。";

  }

}


window.addEventListener(
  "message",
  function(event) {

    if (
      !event.data ||
      event.data.type !==
        "orderSystemResult"
    ) {
      return;
    }

    const result =
      event.data.data;

    const message =
      document.getElementById("message");


    if (!result.ok) {

      message.textContent =
        result.message;

      return;
    }


    if (
      result.action !==
      "getSettlement"
    ) {
      return;
    }


    document
      .getElementById("userIdText")
      .textContent =
      result.userId;


    document
      .getElementById("userNameText")
      .textContent =
      result.name;


    document
      .getElementById("totalText")
      .textContent =
      "￥" +
      Number(
        result.total
      ).toLocaleString();


    document
      .getElementById("bankText")
      .textContent =
      result.bank;


    document
      .getElementById("settlementArea")
      .style.display =
      "block";


    message.textContent =
      "";

  }
);


initialize();

</script>

</body>

</html>

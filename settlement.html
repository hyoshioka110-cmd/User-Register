<!DOCTYPE html>
<html lang="ja">

<head>

<meta charset="UTF-8">

<meta
  name="viewport"
  content="width=device-width, initial-scale=1"
>

<title>ご精算</title>

<script src="https://static.line-scdn.net/liff/edge/2/sdk.js"></script>

<style>

body {
  font-family: sans-serif;
  background: #f5f5f5;
  margin: 0;
  padding: 18px;
  font-size: 20px;
}

.box {
  max-width: 560px;
  margin: 20px auto;
  background: white;
  padding: 24px;
  border-radius: 14px;
  box-sizing: border-box;
}

h2 {
  text-align: center;
  font-size: 30px;
}

.userBox {
  background: #f1f8f3;
  padding: 16px;
  border-radius: 10px;
  margin-bottom: 24px;
  line-height: 1.8;
}

.amountBox {
  border: 1px solid #cccccc;
  border-radius: 12px;
  padding: 20px;
  text-align: center;
  margin-top: 18px;
}

.amountLabel {
  font-size: 19px;
}

.amount {
  font-size: 34px;
  font-weight: bold;
  margin-top: 8px;
}

.pointBox {
  background: #fff8e1;
  border-radius: 12px;
  padding: 20px;
  margin-top: 20px;
}

.pointTitle {
  text-align: center;
  font-size: 19px;
}

.pointAmount {
  text-align: center;
  font-size: 30px;
  font-weight: bold;
  margin: 10px 0 18px;
}

.usePointButton {
  width: 100%;
  min-height: 58px;
  font-size: 19px;
  font-weight: bold;
  background: #4285f4;
  color: white;
  border: none;
  border-radius: 10px;
}

.usePointButton.selected {
  background: #e67e22;
}

.discountBox {
  margin-top: 20px;
  line-height: 2;
}

.paymentBox {
  border: 2px solid #06C755;
  border-radius: 12px;
  padding: 22px;
  text-align: center;
  margin-top: 22px;
}

.paymentLabel {
  font-size: 20px;
}

.paymentAmount {
  font-size: 38px;
  font-weight: bold;
  margin-top: 8px;
}

.bankBox {
  margin-top: 28px;
  padding: 20px;
  background: #fafafa;
  border-radius: 10px;
  line-height: 1.8;
  white-space: pre-line;
}

.settlementButton {
  width: 100%;
  min-height: 62px;
  margin-top: 26px;
  font-size: 21px;
  font-weight: bold;
  background: #06C755;
  color: white;
  border: none;
  border-radius: 10px;
}

.settlementButton:disabled {
  background: #aaaaaa;
}

#message {
  text-align: center;
  margin-top: 20px;
  line-height: 1.6;
  white-space: pre-wrap;
}

.notice {
  font-size: 15px;
  line-height: 1.6;
  color: #555;
  margin-top: 14px;
}

.completeBox {
  margin-top: 24px;
  padding: 22px;
  border: 2px solid #06C755;
  border-radius: 12px;
  background: #f1fff5;
  text-align: center;
  line-height: 1.8;
}

.completeTitle {
  font-size: 25px;
  font-weight: bold;
  color: #06C755;
  margin-bottom: 12px;
}

</style>

</head>

<body>

<div class="box">

<h2>ご精算</h2>

<div class="userBox">

  <div>
    利用者ID：
    <strong id="userIdText">
      確認中...
    </strong>
  </div>

  <div>
    お名前：
    <strong id="userNameText">
      確認中...
    </strong>
  </div>

</div>


<div id="message">
LINE情報を確認しています...
</div>


<div
  id="settlementArea"
  style="display:none;"
>

  <div class="amountBox">

    <div class="amountLabel">
      未払い金額
    </div>

    <div
      class="amount"
      id="totalText"
    >
      ￥0
    </div>

  </div>


  <div class="pointBox">

    <div class="pointTitle">
      現在のポイント
    </div>

    <div
      class="pointAmount"
      id="pointText"
    >
      0 PT
    </div>

    <button
      type="button"
      id="usePointButton"
      class="usePointButton"
      onclick="togglePoints()"
    >
      全ポイントを利用する
    </button>

    <div class="notice">
      ポイントを利用する場合でも、
      入金確認まではポイントは減りません。
    </div>

  </div>


  <div class="discountBox">

    <div>
      ポイント値引き：
      <strong id="discountText">
        ￥0
      </strong>
    </div>

  </div>


  <div class="paymentBox">

    <div class="paymentLabel">
      お支払い金額
    </div>

    <div
      class="paymentAmount"
      id="paymentText"
    >
      ￥0
    </div>

  </div>


  <div class="bankBox">

    <strong>振込先</strong>

    <div id="bankText"></div>

  </div>


  <button
    type="button"
    id="settlementButton"
    class="settlementButton"
    onclick="createSettlement()"
  >
    この内容で精算する
  </button>


  <div
    id="completeArea"
    class="completeBox"
    style="display:none;"
  >

    <div class="completeTitle">
      精算を受け付けました
    </div>

    <div>
      お支払い金額：
      <strong id="completePaymentText">
        ￥0
      </strong>
    </div>

    <div>
      精算ID：
      <strong id="completeSettlementId">
      </strong>
    </div>

    <br>

    <div>
      上記金額を振込先へお振込みください。
    </div>

    <div>
      入金確認後、注文は「支払い済み」に更新されます。
    </div>

  </div>

</div>

</div>


<form
  id="apiForm"
  method="post"
  target="resultFrame"
  style="display:none;"
>

<input
  type="hidden"
  name="action"
  id="action"
>

<input
  type="hidden"
  name="lineUserId"
  id="sendLineUserId"
>

<input
  type="hidden"
  name="usePoints"
  id="sendUsePoints"
>

</form>


<iframe
  name="resultFrame"
  id="resultFrame"
  style="display:none;"
></iframe>


<script>

const LIFF_ID =
  "2011016159-YnmXbx1i";

const SETTLEMENT_PAGE_URL =
  "https://hyoshioka110-cmd.github.io/User-Register/settlement.html";

const ORDER_GAS_URL =
  "https://script.google.com/macros/s/AKfycbwg6eVWj-IGAif9hTAOVjn1joTCQveAALD3qfotkySfRKiOc5o5ecn0aaJr5iWNw_rfsg/exec";


let lineUserId = "";

let totalAmount = 0;

let pointBalance = 0;

let usePoints = false;


/* ==============================
   LINE初期化
================================ */

async function initialize() {

  const message =
    document.getElementById("message");

  try {

    message.textContent =
      "LINE情報を確認しています...";

    await liff.init({
      liffId: LIFF_ID
    });

    if (!liff.isLoggedIn()) {

      liff.login({
        redirectUri:
          SETTLEMENT_PAGE_URL
      });

      return;
    }

    const profile =
      await liff.getProfile();

    lineUserId =
      profile.userId;

    message.textContent =
      "精算情報を取得しています...";

    loadSettlement();

  } catch (error) {

    console.error(error);

    message.textContent =
      "LINE情報を取得できませんでした。";

  }

}


/* ==============================
   精算情報取得
================================ */

function loadSettlement() {

  document
    .getElementById("action")
    .value =
    "getSettlement";

  document
    .getElementById("sendLineUserId")
    .value =
    lineUserId;

  submitApi();

}


/* ==============================
   API送信
================================ */

function submitApi() {

  const form =
    document.getElementById("apiForm");

  form.action =
    ORDER_GAS_URL;

  form.submit();

}


/* ==============================
   API結果受信
================================ */

window.addEventListener(
  "message",
  function(event) {

    if (
      !event.data ||
      event.data.type !==
        "orderSystemResult"
    ) {
      return;
    }


    const result =
      event.data.data;

    const message =
      document.getElementById("message");


   if (!result.ok) {

  message.textContent =
    result.message;

  const button =
    document.getElementById(
      "settlementButton"
    );

  button.disabled = false;

  button.textContent =
    "この内容で精算する";

  return;
}


    if (
      result.action ===
      "getSettlement"
    ) {

      document
        .getElementById("userIdText")
        .textContent =
        result.userId;

      document
        .getElementById("userNameText")
        .textContent =
        result.name;


      totalAmount =
        Number(
          result.total || 0
        );

      pointBalance =
        Number(
          result.pointBalance || 0
        );


      document
        .getElementById("totalText")
        .textContent =
        yen(totalAmount);


      document
        .getElementById("pointText")
        .textContent =
        pointBalance
          .toLocaleString() +
        " PT";


      document
        .getElementById("bankText")
        .textContent =
        result.bank;


      usePoints =
        false;


      updateAmounts();


      document
        .getElementById("settlementArea")
        .style.display =
        "block";


      if (totalAmount <= 0) {

        message.textContent =
          "現在、未払いの注文はありません。";

        document
          .getElementById("settlementButton")
          .disabled =
          true;

      } else {

        message.textContent =
          "";

      }


      if (pointBalance <= 0) {

        document
          .getElementById("usePointButton")
          .disabled =
          true;

        document
          .getElementById("usePointButton")
          .textContent =
          "利用できるポイントはありません";

      }

      return;
    }


    if (
      result.action ===
      "createSettlement"
    ) {

      document
        .getElementById("settlementButton")
        .disabled =
        true;


      document
        .getElementById("settlementButton")
        .textContent =
        "精算受付完了";


      document
        .getElementById("usePointButton")
        .disabled =
        true;


      document
        .getElementById("discountText")
        .textContent =
        "－" +
        yen(
          Number(
            result.pointUsed || 0
          )
        );


      document
        .getElementById("paymentText")
        .textContent =
        yen(
          Number(
            result.paymentAmount || 0
          )
        );


      document
        .getElementById("completePaymentText")
        .textContent =
        yen(
          Number(
            result.paymentAmount || 0
          )
        );


      document
        .getElementById("completeSettlementId")
        .textContent =
        result.settlementId;


      document
        .getElementById("completeArea")
        .style.display =
        "block";


      message.textContent =
        "";


      document
        .getElementById("completeArea")
        .scrollIntoView({
          behavior: "smooth",
          block: "center"
        });

      return;
    }

  }
);


/* ==============================
   ポイント利用切替
================================ */

function togglePoints() {

  if (pointBalance <= 0) {
    return;
  }


  usePoints =
    !usePoints;


  const button =
    document
      .getElementById("usePointButton");


  if (usePoints) {

    button.textContent =
      "ポイントを利用する ✓";

    button.classList.add(
      "selected"
    );

  } else {

    button.textContent =
      "全ポイントを利用する";

    button.classList.remove(
      "selected"
    );

  }


  updateAmounts();

}


/* ==============================
   金額計算
================================ */

function updateAmounts() {

  let discount =
    0;


  if (usePoints) {

    discount =
      Math.min(
        pointBalance,
        totalAmount
      );

  }


  const payment =
    Math.max(
      totalAmount -
      discount,
      0
    );


  document
    .getElementById("discountText")
    .textContent =
    discount > 0
      ? "－" + yen(discount)
      : yen(0);


  document
    .getElementById("paymentText")
    .textContent =
    yen(payment);

}


/* ==============================
   精算申請
================================ */

function createSettlement() {

  if (totalAmount <= 0) {

    alert(
      "未払いの注文はありません。"
    );

    return;
  }


  const discount =
    usePoints
      ? Math.min(
          pointBalance,
          totalAmount
        )
      : 0;


  const payment =
    totalAmount -
    discount;


  const text =

    "未払い金額：" +
    yen(totalAmount) +

    "\nポイント利用：" +
    discount +
    " PT" +

    "\nお支払い金額：" +
    yen(payment) +

    "\n\nこの内容で精算しますか？";


  if (!confirm(text)) {
    return;
  }


  document
    .getElementById("settlementButton")
    .disabled =
    true;


  document
    .getElementById("settlementButton")
    .textContent =
    "精算処理中...";


  document
    .getElementById("message")
    .textContent =
    "精算情報を登録しています...";


  document
    .getElementById("action")
    .value =
    "createSettlement";


  document
    .getElementById("sendLineUserId")
    .value =
    lineUserId;


  document
    .getElementById("sendUsePoints")
    .value =
    usePoints
      ? "true"
      : "false";


  submitApi();

}


/* ==============================
   円表示
================================ */

function yen(value) {

  return "￥" +
    Number(
      value || 0
    ).toLocaleString();

}


initialize();

</script>

</body>

</html>

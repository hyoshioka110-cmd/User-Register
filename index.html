<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<title>利用者登録</title>

<script src="https://static.line-scdn.net/liff/edge/2/sdk.js"></script>

<style>

body{
    font-family:sans-serif;
    background:#f5f5f5;
    padding:30px;
}

.box{
    max-width:450px;
    margin:auto;
    background:white;
    padding:30px;
    border-radius:10px;
}

h2{
    text-align:center;
}

</style>

</head>

<body>

<div class="box">

<h2>利用者登録</h2>

<p id="message">
LIFF初期化中...
</p>

</div>

<script>

const LIFF_ID="2011016159-YnmXbx1i";

async function start(){

    try{

        document.getElementById("message").innerHTML="① LIFF初期化開始";

        await liff.init({
            liffId:LIFF_ID
        });

        document.getElementById("message").innerHTML="② LIFF初期化成功";

    }catch(e){

        document.getElementById("message").innerHTML=e.message;

    }

}

start();

</script>

</body>
</html>
